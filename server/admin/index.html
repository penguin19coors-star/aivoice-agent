<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Agent Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    line-height: 1.5;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    background: linear-gradient(90deg, #58a6ff, #a371f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    transition: border-color .2s;
  }
  .stat-card:hover {
    border-color: #58a6ff;
  }
  .stat-label {
    font-size: 12px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 600;
    color: #f0f6fc;
  }
  .stat-change {
    font-size: 14px;
    margin-top: 4px;
  }
  .positive { color: #3fb950; }
  .neutral { color: #58a6ff; }
  .section {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #f0f6fc;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid #21262d;
  }
  th {
    font-weight: 600;
    color: #8b949e;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: .5px;
  }
  tr:hover {
    background: #1c2128;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-success {
    background: rgba(63, 185, 80, .15);
    color: #3fb950;
    border: 1px solid rgba(63, 185, 80, .2);
  }
  .badge-warning {
    background: rgba(210, 153, 34, .15);
    color: #d29922;
    border: 1px solid rgba(210, 153, 34, .2);
  }
  .badge-neutral {
    background: rgba(139, 148, 158, .15);
    color: #8b949e;
    border: 1px solid rgba(139, 148, 158, .2);
  }
  .btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover {
    background: #30363d;
    border-color: #58a6ff;
  }
  .btn-primary {
    background: #238636;
    border-color: rgba(63, 185, 80, .4);
  }
  .btn-primary:hover {
    background: #2ea043;
  }
  .chart-bar {
    height: 8px;
    background: #21262d;
    border-radius: 4px;
    overflow: hidden;
    min-width: 120px;
  }
  .chart-fill {
    height: 100%;
    background: linear-gradient(90deg, #58a6ff, #a371f7);
    border-radius: 4px;
    transition: width .6s ease;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #8b949e;
  }
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal.active {
    display: flex;
  }
  .modal-content {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 640px;
    max-height: 80vh;
    overflow-y: auto;
  }
  input, textarea, select {
    width: 100%;
    padding: 8px 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 12px;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #58a6ff;
  }
  label {
    display: block;
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .twoline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .empty {
    text-align: center;
    color: #8b949e;
    padding: 32px;
  }
</style>
</head>
<body>

<header>
  <h1>🎙️ AI Voice Agent</h1>
  <div>
    <button class="btn" onclick="refreshNow()">↻ Refresh</button>
    <button class="btn btn-primary" onclick="openAdModal()">+ New Ad</button>
  </div>
</header>

<div class="container">
  <div class="stats-grid" id="stats">
    <div class="loading">Loading…</div>
  </div>

  <div class="section">
    <h2>📢 Ad Inventory</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Sponsor</th>
          <th>Industry</th>
          <th>CPM</th>
          <th>Daily Cap</th>
          <th>Played Today</th>
          <th>Revenue</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="adTableBody"><tr><td class="empty" colspan="9">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>📞 Live / Recent Sessions</h2>
    <div id="sessionsList"><div class="loading">Loading…</div></div>
  </div>

  <div class="section">
    <h2>💰 Cost Model</h2>
    <div id="costModel"></div>
  </div>
</div>

<!-- New Ad Modal -->
<div class="modal" id="adModal">
  <div class="modal-content">
    <h2>Create New Ad</h2>
    <form onsubmit="createAd(event)">
      <label>Sponsor Name</label>
      <input type="text" name="sponsor" required placeholder="e.g. TurboHost">

      <label>Industry</label>
      <select name="industry">
        <option value="technology">Technology</option>
        <option value="home_services">Home Services</option>
        <option value="health">Health</option>
        <option value="travel">Travel</option>
        <option value="legal">Legal</option>
        <option value="finance">Finance</option>
        <option value="education">Education</option>
      </select>

      <label>Keywords (comma-separated)</label>
      <input type="text" name="keywords" required placeholder="e.g. server, cloud, vps">

      <label>Ad Script (spoken, ≤ 120 words)</label>
      <textarea name="script" rows=4 required placeholder="Check out TurboHost — blazing-fast VPS starting at $4/mo."></textarea>

      <label>CPM Bid (USD per 1000 plays)</label>
      <input type="number" name="bid_cpm" step="0.01" min="0.25" value="5.00">

      <label>Daily Cap</label>
      <input type="number" name="daily_cap" min="1" value="100">

      <label>Weight (relative priority; higher = promoted)</label>
      <input type="number" name="weight" step="0.1" min="0.1" value="1.0">

      <div class="actions">
        <button type="button" class="btn" onclick="closeAdModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Ad</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let pollInterval = null;

function fmt$(v) {
  if (v == null) return "$0.00";
  return "$" + Number(v).toFixed(2);
}

async function loadStats() {
  try {
    const [rStats, rAds] = await Promise.all([
      fetch(API_BASE + "/health").then(r => r.json()),
      fetch(API_BASE + "/admin/ads").then(r => r.json()),
    ]);

    const ads = rAds.ads || [];
    const counts = rAds.play_counts || {};
    const totalRev = rAds.total_revenue_usd || 0;

    // Compute stats
    const totalPlays = Object.values(counts).reduce((a,b)=>a+b, 0);
    const avgCPM = totalPlays > 0 ? (totalRev / totalPlays * 1000) : 0;
    const activeAds = ads.filter(a => a.active).length;

    document.getElementById("stats").innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Today's Revenue</div>
        <div class="stat-value">${fmt$(totalRev)}</div>
        <div class="stat-change neutral">${totalPlays} ad plays</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Revenue / Call (est.)</div>
        <div class="stat-value">${fmt$(totalRev / Math.max(1, Object.keys(ads).length))}</div>
        <div class="stat-change neutral">1 ad / call assumed</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Ads / Total</div>
        <div class="stat-value">${activeAds} / ${ads.length}</div>
        <div class="stat-change neutral">CPM avg ${fmt$(avgCPM)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sessions Active</div>
        <div class="stat-value">${rStats.sessions_active ?? 0}</div>
        <div class="stat-change neutral">live now</div>
      </div>
    `;

    // Ad table
    const tbody = document.getElementById("adTableBody");
    if (ads.length === 0) {
      tbody.innerHTML = `<tr><td class="empty" colspan="9">No ads yet. Click "+ New Ad" to create one.</td></tr>`;
    } else {
      tbody.innerHTML = ads.map(ad => {
        const played = counts[ad.id] || 0;
        const rev = (ad.bid_cpm / 1000) * played;
        const pct = played / Math.max(1, ad.daily_cap) * 100;
        const statusBadge = ad.active
          ? (pct >= 95
              ? `<span class="badge badge-warning">near cap</span>`
              : `<span class="badge badge-success">active</span>`)
          : `<span class="badge badge-neutral">paused</span>`;
        return `<tr>
          <td><code>${ad.id}</code></td>
          <td>${ad.sponsor}</td>
          <td>${ad.industry}</td>
          <td>${fmt$(ad.bid_cpm)}</td>
          <td>${ad.daily_cap}</td>
          <td>
            ${played}
            <div class="chart-bar"><div class="chart-fill" style="width:${Math.min(100, pct)}%"></div></div>
          </td>
          <td>${fmt$(rev)}</td>
          <td>${statusBadge}</td>
          <td>
            <button class="btn" onclick="toggleAd('${ad.id}')">${ad.active ? 'Pause' : 'Resume'}</button>
            <button class="btn" onclick="deleteAd('${ad.id}')">×</button>
          </td>
        </tr>`;
      }).join("");
    }

    // Cost model
    document.getElementById("costModel").innerHTML = `
      <table>
        <thead><tr><th>Cost Item</th><th>Per Call (5 min)</th><th>Monthly (1K calls)</th><th>Notes</th></tr></thead>
        <tbody>
          <tr><td>Render Free Tier</td><td>$0.00*</td><td>$0.00*</td><td>*Free tier sleeps after 15 min inactivity; upgrade $7/mo for always-on</td></tr>
          <tr><td>Deepgram STT</td><td>~$0.00</td><td>~$0.00</td><td>Free tier: 200 min/mo; then ~$0.0043/min</td></tr>
          <tr><td>LLM (Llama 8B)</td><td>~$0.002</td><td>~$2.00</td><td>~$0.30/1M input tokens</td></tr>
          <tr><td>TTS (ElevenLabs)</td><td>~$0.02</td><td>~$20.00</td><td>~$0.045/min; cheaper with deepgram tts</td></tr>
          <tr><td>Twilio PSTN In</td><td>~$0.07</td><td>~$70.00</td><td>$0.0084/min inbound US; varies by country</td></tr>
          <tr style="font-weight:600;"><td>Total</td><td>~$0.09</td><td>~$92</td><td>Revenue from 1 ad/call breaks even at $0.09 CPM</td></tr>
        </tbody>
      </table>
    `;
  } catch (e) {
    console.error("Load error:", e);
    document.getElementById("stats").innerHTML = `<div class="stat-card"><div class="stat-label">Error</div><div class="stat-value" style="color:#f85149;">${e.message}</div></div>`;
  }
}

async function createAd(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const payload = {
    sponsor: f.get("sponsor"),
    industry: f.get("industry"),
    keywords: f.get("keywords").split(",").map(s => s.trim()).filter(Boolean),
    script: f.get("script"),
    bid_cpm: parseFloat(f.get("bid_cpm")),
    daily_cap: parseInt(f.get("daily_cap")),
    weight: parseFloat(f.get("weight")),
    active: true,
  };
  const r = await fetch(API_BASE + "/admin/ads", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload),
  });
  if (r.ok) { closeAdModal(); loadStats(); }
  else alert("Error creating ad");
}

async function toggleAd(id) {
  await fetch(API_BASE + `/admin/ads/${id}/toggle`, { method: "POST" });
  loadStats();
}

async function deleteAd(id) {
  if (!confirm("Delete this ad permanently?")) return;
  const r = await fetch(API_BASE + `/admin/ads/${id}`, { method: "DELETE" });
  if (r.ok) loadStats();
}

function openAdModal() {
  document.getElementById("adModal").classList.add("active");
}
function closeAdModal() {
  document.getElementById("adModal").classList.remove("active");
}

function refreshNow() {
  loadStats();
}

document.addEventListener("DOMContentLoaded", () => {
  loadStats();
  pollInterval = setInterval(loadStats, 15000);
});
</script>
</body>
</html>
