<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ad Console</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#10141a" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ad Console" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141a; --bg2:#0a0d12; --card:#1c232d; --card2:#28313d;
    --border:#3a4654; --border2:#566476;
    --text:#f4f8fc; --muted:#aab6c4; --dim:#7a8694;
    --cyan:#34d7f0; --teal:#2dd4bf;
    --green:#43e889; --yellow:#fcc434; --red:#ff7070;
    --shadow:0 10px 30px rgba(0,0,0,.50);
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Sora',-apple-system,system-ui,sans-serif;
    --sidebar-w:248px;
  }
  [data-theme="light"]{
    --bg:#f4f6f9; --bg2:#eaeef3; --card:#ffffff; --card2:#f0f3f7;
    --border:#d4dbe3; --border2:#bcc6d1;
    --text:#0f1720; --muted:#54606c; --dim:#8a96a2;
    --cyan:#0891b2; --teal:#0d9488;
    --green:#059669; --yellow:#b45309; --red:#dc2626;
    --shadow:0 6px 18px rgba(15,23,32,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); color:var(--text); line-height:1.45;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(52,215,240,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 10%, rgba(45,212,191,.06), transparent 55%),
      var(--bg);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
  a{color:var(--cyan);}
  .shell{display:flex; min-height:100vh; position:relative;}
  .sidebar{
    width:var(--sidebar-w); flex:none; background:linear-gradient(180deg,var(--card),var(--bg2));
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; transition:transform .28s cubic-bezier(.4,0,.2,1); z-index:60;
  }
  .sidebar-head{display:flex; align-items:center; gap:11px; padding:18px 16px 16px; border-bottom:1px solid var(--border);}
  .sidebar-head .mark{width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,#1b2026,#0f1216); border:1px solid var(--border2); display:grid;place-items:center;}
  .sidebar-head .mark svg{width:21px;height:21px;}
  .sidebar-head h1{font-size:14px;font-weight:700;letter-spacing:.02em;}
  .sidebar-head .sub{color:var(--dim);font-size:10px;font-family:var(--mono);margin-top:1px;}
  .navlist{flex:1; overflow-y:auto; padding:12px 10px 16px;}
  .nav-section{color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:14px 10px 7px;}
  .nav{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; cursor:pointer;
    color:var(--muted); font-size:13.5px; font-weight:600; margin-bottom:3px; border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s; position:relative;}
  .nav:hover{background:rgba(255,255,255,.06); color:var(--text);}
  .nav.active{background:rgba(52,215,240,.16); color:var(--text); border-color:rgba(52,215,240,.4);}
  .nav.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--cyan),var(--teal));}
  .nav svg{width:18px;height:18px;flex:none;opacity:.9;}
  .nav .nname{flex:1;}
  .sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);color:var(--dim);font-size:10px;font-family:var(--mono);}
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; gap:12px; padding:14px 18px; position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg,var(--bg) 65%,transparent); backdrop-filter:blur(8px);}
  .hamburger{display:none; width:40px;height:40px;border-radius:10px;border:1px solid var(--border2);
    background:var(--card); cursor:pointer; align-items:center; justify-content:center; flex:none; transition:.15s;}
  .hamburger:hover{background:var(--card2);border-color:var(--cyan);}
  .hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px;position:relative;}
  .hamburger span::before,.hamburger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--text);border-radius:2px;}
  .hamburger span::before{top:-6px;} .hamburger span::after{top:6px;}
  .topbar .title{font-size:17px;font-weight:700;flex:1;}
  .iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border2);background:var(--card);
    color:var(--cyan); cursor:pointer; display:grid;place-items:center;flex:none; transition:background .15s,border-color .15s,transform .15s;}
  .iconbtn:hover{background:var(--card2);border-color:var(--cyan);}
  .iconbtn:active{transform:scale(.92);}
  .iconbtn svg{width:18px;height:18px;}
  .iconbtn.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .content{padding:6px 18px 64px; max-width:1000px; width:100%; margin:0 auto;}
  .grid{display:grid; gap:14px;}
  .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-bottom:18px;}
  .stat{background:linear-gradient(180deg,var(--card),var(--bg2)); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  .stat .label{color:var(--dim);font-size:9.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;}
  .stat .value{font-size:30px;font-weight:700;font-family:var(--mono);margin-top:6px;line-height:1;}
  .stat .value small{font-size:13px;color:var(--muted);font-weight:500;}
  .section-card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);box-shadow:var(--shadow);border-radius:16px;padding:18px;margin-bottom:16px;}
  .section-card h3{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:12px;}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ad{border:1px solid var(--border);border-radius:14px;padding:15px 16px;margin-bottom:12px;background:rgba(255,255,255,.015);transition:border-color .15s;}
  .ad:hover{border-color:var(--border2);}
  .ad .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .ad .sponsor{font-size:16px;font-weight:700;}
  .ad .industry{color:var(--dim);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .ad .script{color:var(--muted);font-size:13px;margin:10px 0;line-height:1.5;}
  .ad .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:12px;}
  .ad .meta b{color:var(--text);}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;font-family:var(--mono);padding:4px 10px;border-radius:20px;border:1px solid var(--border2);letter-spacing:.03em;}
  .badge .dot{width:7px;height:7px;border-radius:50%;}
  .b-green{color:var(--green);border-color:rgba(67,232,137,.4);} .b-green .dot{background:var(--green);}
  .b-gray{color:var(--muted);} .b-gray .dot{background:var(--dim);}
  .b-cyan{color:var(--cyan);border-color:rgba(52,215,240,.4);} .b-cyan .dot{background:var(--cyan);}
  .b-teal{color:var(--teal);border-color:rgba(45,212,191,.4);} .b-teal .dot{background:var(--teal);}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .kw{font-size:11px;font-family:var(--mono);color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;}
  .ad .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.03em;border:1px solid;transition:background .15s,border-color .15s,transform .1s;background:var(--card2);border-color:var(--border2);color:var(--text);}
  .btn:hover{border-color:var(--border2);} .btn:active{transform:scale(.96);}
  .btn.sm{padding:7px 12px;font-size:11.5px;}
  .btn.cyan{background:rgba(52,215,240,.10);border-color:rgba(52,215,240,.35);color:var(--cyan);}
  .btn.cyan:hover{background:rgba(52,215,240,.2);border-color:var(--cyan);}
  .btn.green{background:rgba(67,232,137,.08);border-color:rgba(67,232,137,.32);color:var(--green);}
  .btn.red{background:rgba(255,112,112,.08);border-color:rgba(255,112,112,.32);color:var(--red);}
  .btn.red:hover{background:rgba(255,112,112,.18);border-color:var(--red);}
  .btn.primary{background:linear-gradient(135deg,var(--cyan),var(--teal));border-color:transparent;color:#04181c;box-shadow:0 4px 14px rgba(34,211,238,.25);}
  .btn.block{width:100%;text-align:center;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:5px;}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);
    font-family:var(--sans);font-size:14px;outline:none;transition:border-color .15s;}
  input:focus,textarea:focus,select:focus{border-color:var(--cyan);}
  textarea{resize:vertical;min-height:80px;line-height:1.5;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .variant{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg2);}
  .variant .between{margin-bottom:8px;}
  .vrm{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-family:var(--mono);}
  .muted{color:var(--muted);font-size:13px;}
  .dim{color:var(--dim);font-size:12px;font-family:var(--mono);}
  .err{color:var(--red);font-size:13px;font-family:var(--mono);}
  .loading{color:var(--muted);font-size:13px;padding:40px;text-align:center;font-family:var(--mono);}
  .modal-bg{position:fixed;inset:0;background:rgba(8,10,12,.72);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px;overflow-y:auto;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:22px;max-width:560px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);margin:auto;}
  .modal h3{font-size:18px;margin-bottom:16px;color:var(--text);text-transform:none;letter-spacing:0;font-family:var(--sans);}
  .modal-actions{display:flex;gap:11px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:50;}
  .overlay.show{display:block;}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(env(safe-area-inset-bottom) + 24px);background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:13px 19px;font-size:13px;font-family:var(--mono);z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:300;padding:24px;}
  .gate.show{display:flex;}
  .gate .box{max-width:380px;width:100%;text-align:center;}
  .gate .mark{width:56px;height:56px;border-radius:14px;margin:0 auto 18px;background:linear-gradient(135deg,#1b2026,#0f1216);border:1px solid var(--border2);display:grid;place-items:center;}
  .gate .mark svg{width:34px;height:34px;}
  .gate h2{font-size:20px;margin-bottom:8px;}
  .gate p{color:var(--muted);font-size:13.5px;margin-bottom:20px;}
  .install{display:none;}
  @media (max-width:780px){
    .sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);box-shadow:14px 0 40px rgba(0,0,0,.4);}
    .sidebar.open{transform:translateX(0);}
    .hamburger{display:flex;}
    .content{padding:6px 14px 64px;}
    .two,.three{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="mark"><svg viewBox="0 0 64 64" fill="none"><rect x="6" y="26" width="6" height="12" rx="3" fill="#34d7f0"/><rect x="18" y="18" width="6" height="28" rx="3" fill="#34d7f0"/><rect x="30" y="8" width="6" height="48" rx="3" fill="#2dd4bf"/><rect x="42" y="18" width="6" height="28" rx="3" fill="#2dd4bf"/><rect x="54" y="26" width="6" height="12" rx="3" fill="#2dd4bf"/></svg></span>
      <div><h1>Ad Console</h1><div class="sub" id="sideSub">AI Voice Agent</div></div>
    </div>
    <div class="navlist" id="navlist">
      <div class="nav-section">Manage</div>
      <div class="nav" data-sec="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span class="nname">Overview</span></div>
      <div class="nav" data-sec="ads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg><span class="nname">Ads</span></div>
      <div class="nav" data-sec="frequency"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nname">Frequency</span></div>
      <div class="nav" data-sec="cue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="nname">Intro/Outro</span></div>
      <div class="nav-section">Revenue</div>
      <div class="nav" data-sec="billing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="nname">Billing</span></div>
    </div>
    <div class="sidebar-foot"><span id="connState">connecting…</span> &middot; <a href="#" id="signout">sign out</a></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span></button>
      <div class="title" id="pageTitle">Overview</div>
      <button class="iconbtn install" id="installBtn" title="Install app" aria-label="Install"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></button>
      <button class="iconbtn" id="themeBtn" title="Theme" aria-label="Theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="iconbtn" id="refreshBtn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <div class="content"><div id="view"><div class="loading">loading…</div></div></div>
  </main>
</div>

<div class="gate" id="gate">
  <div class="box">
    <div class="mark"><svg viewBox="0 0 64 64" fill="none"><rect x="6" y="26" width="6" height="12" rx="3" fill="#34d7f0"/><rect x="18" y="18" width="6" height="28" rx="3" fill="#34d7f0"/><rect x="30" y="8" width="6" height="48" rx="3" fill="#2dd4bf"/><rect x="42" y="18" width="6" height="28" rx="3" fill="#2dd4bf"/><rect x="54" y="26" width="6" height="12" rx="3" fill="#2dd4bf"/></svg></div>
    <h2>Ad Console</h2>
    <p>Enter your admin token to manage ads, placement, frequency and the intro sound.</p>
    <div class="field"><input type="password" id="tokenInput" placeholder="Admin token" autocomplete="off" /></div>
    <button class="btn primary block" id="tokenBtn">Unlock</button>
    <div id="gateErr" class="err" style="margin-top:12px;"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
var TOKEN = "";
var SECTION = "overview";
var STATS = null;
var deferredInstall = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function money(n){ return "$" + (Number(n)||0).toFixed(2); }

function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(window._tt); window._tt=setTimeout(function(){t.classList.remove("show");},3200); }

function api(path, method, body){
  return fetch(path, {
    method: method || "GET",
    headers: { "X-Admin-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    if(r.status===401 || r.status===403){ logout(); throw new Error("Unauthorized"); }
    return r.text().then(function(t){
      var data; try{ data = t ? JSON.parse(t) : {}; }catch(e){ data = {}; }
      if(!r.ok) throw new Error((data && data.detail) || ("HTTP " + r.status));
      return data;
    });
  });
}

/* ---- theme ---- */
function applyTheme(){ try{ if(localStorage.getItem("ac_theme")==="light") document.documentElement.setAttribute("data-theme","light"); else document.documentElement.removeAttribute("data-theme"); }catch(e){} }
function toggleTheme(){ var light=document.documentElement.getAttribute("data-theme")==="light"; try{ localStorage.setItem("ac_theme", light?"dark":"light"); }catch(e){} applyTheme(); }

/* ---- auth gate ---- */
function logout(){ TOKEN=""; try{ localStorage.removeItem("ac_token"); }catch(e){} $("gate").classList.add("show"); $("connState").textContent="signed out"; }
function unlock(){
  var v=$("tokenInput").value.trim();
  if(!v){ $("gateErr").textContent="Enter your token."; return; }
  TOKEN=v;
  $("gateErr").textContent="checking…";
  api("/admin/stats","GET").then(function(){
    try{ localStorage.setItem("ac_token", v); }catch(e){}
    $("gate").classList.remove("show"); $("gateErr").textContent="";
    show(SECTION);
  }).catch(function(e){
    TOKEN=""; $("gateErr").textContent = /Unauthorized/.test(String(e)) ? "That token was rejected." : ("Error: " + e.message);
  });
}

/* ---- sidebar ---- */
function openNav(){ $("sidebar").classList.add("open"); $("overlay").classList.add("show"); }
function closeNav(){ $("sidebar").classList.remove("open"); $("overlay").classList.remove("show"); }

var TITLES={ overview:"Overview", ads:"Ads", frequency:"Ad Frequency", cue:"Intro/Outro", billing:"Billing" };
function show(sec){
  SECTION=sec; closeNav();
  $("pageTitle").textContent=TITLES[sec]||sec;
  document.querySelectorAll(".nav").forEach(function(n){ n.classList.toggle("active", n.dataset.sec===sec); });
  if(sec==="overview") renderOverview();
  else if(sec==="ads") renderAds();
  else if(sec==="frequency") renderFrequency();
  else if(sec==="cue") renderCue();
  else if(sec==="billing") renderBilling();
}

function refresh(){
  var b=$("refreshBtn"); b.classList.add("spin");
  STATS=null;
  Promise.resolve(show(SECTION)).finally(function(){ setTimeout(function(){ b.classList.remove("spin"); }, 500); });
}

function getStats(force){
  if(STATS && !force) return Promise.resolve(STATS);
  return api("/admin/stats","GET").then(function(d){ STATS=d; $("connState").textContent="connected"; return d; });
}

/* ---- overview ---- */
function statCard(label, value, sub){
  return '<div class="stat"><div class="label">'+esc(label)+'</div><div class="value">'+value+(sub?' <small>'+esc(sub)+'</small>':'')+'</div></div>';
}
function renderOverview(){
  var v=$("view"); v.innerHTML='<div class="loading">loading…</div>';
  getStats(true).then(function(d){
    var t=d.totals||{};
    var html='<div class="grid stats">'
      +statCard("Active Ads", String(t.active_ads!=null?t.active_ads:"—"), "of "+(t.total_ads!=null?t.total_ads:"—"))
      +statCard("Total Plays", String(t.total_plays!=null?t.total_plays:"—"))
      +statCard("Revenue", money(t.total_revenue_usd))
      +statCard("Live Sessions", String(t.sessions_active!=null?t.sessions_active:"—"))
      +statCard("Impressions", String(t.impressions_logged!=null?t.impressions_logged:"—"))
      +'</div>';
    var calls=t.calls||{};
    html+='<div class="section-card"><h3>Calls Received</h3><div class="grid stats" style="margin-bottom:0;">'
      +statCard("Last 24 hours", String(calls.h24!=null?calls.h24:"—"))
      +statCard("Last 3 days", String(calls.d3!=null?calls.d3:"—"))
      +statCard("Last 7 days", String(calls.d7!=null?calls.d7:"—"))
      +statCard("Last 14 days", String(calls.d14!=null?calls.d14:"—"))
      +statCard("Last 30 days", String(calls.d30!=null?calls.d30:"—"))
      +'</div></div>';
    var ads=(d.ads||[]).slice().sort(function(a,b){ return (b.plays||0)-(a.plays||0); }).slice(0,5);
    html+='<div class="section-card"><h3>Top Ads by Plays</h3>';
    if(!ads.length){ html+='<div class="muted">No ads yet. Add one in the Ads tab.</div>'; }
    else { html+=ads.map(function(a){
      return '<div class="between" style="padding:9px 0;border-top:1px solid var(--border);"><div><b>'+esc(a.sponsor)+'</b> <span class="dim">'+esc(a.industry||"")+'</span></div><div class="dim">'+(a.plays||0)+' plays &middot; '+money(a.revenue_usd)+'</div></div>';
    }).join(""); }
    html+='</div>';
    v.innerHTML=html;
  }).catch(showErr);
}

/* ---- ads ---- */
function placementBadge(p){
  if(p==="start") return '<span class="badge b-cyan"><span class="dot"></span>START OF CALL</span>';
  if(p==="post_search") return '<span class="badge b-teal"><span class="dot"></span>AFTER WEB SEARCH</span>';
  return '<span class="badge b-gray"><span class="dot"></span>KEYWORD</span>';
}
function renderAds(){
  var v=$("view"); v.innerHTML='<div class="loading">loading…</div>';
  getStats(true).then(function(d){
    var ads=d.ads||[];
    var html='<div class="between" style="margin-bottom:16px;"><div class="muted">'+ads.length+' ad'+(ads.length===1?"":"s")+'</div><button class="btn primary" id="newAdBtn">+ New Ad</button></div>';
    if(!ads.length){ html+='<div class="section-card"><div class="muted">No ads yet. Create your first one.</div></div>'; }
    html+=ads.map(function(a){
      var active=a.active!==false;
      var kws=(a.keywords||[]).slice(0,8).map(function(k){ return '<span class="kw">'+esc(k)+'</span>'; }).join("");
      return '<div class="ad">'
        +'<div class="head"><div><div class="sponsor">'+esc(a.sponsor)+'</div><div class="industry">'+esc(a.industry||"")+'</div></div>'
        +'<span class="badge '+(active?"b-green":"b-gray")+'"><span class="dot"></span>'+(active?"ACTIVE":"PAUSED")+'</span></div>'
        +(a.script?'<div class="script">'+esc(a.script)+'</div>':'')
        +'<div class="row" style="margin:6px 0 10px;flex-wrap:wrap;gap:8px;">'+placementBadge(a.placement||"none")+'</div>'
        +(kws?'<div class="pills">'+kws+'</div>':'')
        +'<div class="meta"><span>Plays <b>'+(a.plays||0)+'</b></span><span>Revenue <b>'+money(a.revenue_usd)+'</b></span><span>Bid <b>'+money(a.bid_cpm)+'</b>/1k</span><span>Cap <b>'+(a.daily_cap!=null?a.daily_cap:"—")+'</b></span><span>Weight <b>'+(a.weight!=null?a.weight:"—")+'</b></span></div>'
        +'<div class="actions"><button class="btn sm cyan" data-edit="'+esc(a.id)+'">Edit</button>'
        +'<button class="btn sm '+(active?"":"green")+'" data-toggle="'+esc(a.id)+'">'+(active?"Pause":"Resume")+'</button>'
        +'<button class="btn sm red" data-del="'+esc(a.id)+'" data-name="'+esc(a.sponsor)+'">Delete</button></div>'
        +'</div>';
    }).join("");
    v.innerHTML=html;
  }).catch(showErr);
}

function adById(id){ return (STATS && STATS.ads || []).find(function(a){ return a.id===id; }); }

function adModal(ad){
  var isEdit=!!ad; ad=ad||{};
  var vars=(ad.variants||[]);
  var p=ad.placement||"none";
  function opt(val,lbl){ return '<option value="'+val+'"'+(p===val?" selected":"")+'>'+lbl+'</option>'; }
  var html='<h3>'+(isEdit?"Edit Ad":"New Ad")+'</h3>'
    +'<div class="two"><div class="field"><label>Sponsor</label><input type="text" id="f_sponsor" value="'+esc(ad.sponsor||"")+'"></div>'
    +'<div class="field"><label>Industry</label><input type="text" id="f_industry" value="'+esc(ad.industry||"")+'" placeholder="technology, travel…"></div></div>'
    +'<div class="field"><label>Script (what the assistant reads)</label><textarea id="f_script" placeholder="By the way, …">'+esc(ad.script||"")+'</textarea></div>'
    +'<div class="field"><label>Keywords (comma separated)</label><input type="text" id="f_keywords" value="'+esc((ad.keywords||[]).join(", "))+'" placeholder="software, app, cloud"></div>'
    +'<div class="field"><label>Placement</label><select id="f_placement">'+opt("none","None &mdash; matched by keyword")+opt("start","Start of call")+opt("post_search","After web search")+'</select><div class="hint">Start &amp; after-search ads rotate evenly across all ads set to that trigger.</div></div>'
    +'<div class="three"><div class="field"><label>Bid /1k</label><input type="number" step="0.01" id="f_bid" value="'+(ad.bid_cpm!=null?ad.bid_cpm:0)+'"></div>'
    +'<div class="field"><label>Daily cap</label><input type="number" id="f_cap" value="'+(ad.daily_cap!=null?ad.daily_cap:100)+'"></div>'
    +'<div class="field"><label>Weight</label><input type="number" step="0.1" id="f_weight" value="'+(ad.weight!=null?ad.weight:1)+'"></div></div>'
    +'<div class="field"><label>Variants (optional A/B scripts)</label><div class="hint" style="margin:-2px 0 8px;">Each variant can be toggled for Start-of-call (rotated in turn) and/or used elsewhere.</div><div id="varList"></div><button class="btn sm" id="addVar" type="button">+ Add variant</button></div>'
    +'<div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">'+(isEdit?"Save changes":"Create ad")+'</button></div>';
  openModal(html);
  vars.forEach(addVariantRow);
  $("addVar").onclick=function(){ addVariantRow({keywords:[],script:""}); };
  $("cancelBtn").onclick=closeModal;
  $("saveBtn").onclick=function(){ saveAd(isEdit?ad.id:null); };
}
function addVariantRow(v){
  v=v||{keywords:[],script:""};
  var wrap=document.createElement("div"); wrap.className="variant";
  wrap.innerHTML='<div class="between"><span class="dim">Variant</span><button class="vrm" type="button">remove</button></div>'
    +'<div class="field" style="margin-bottom:8px;"><input type="text" class="v_kw" value="'+esc((v.keywords||[]).join(", "))+'" placeholder="keywords (comma separated)"></div>'
    +'<textarea class="v_sc" placeholder="variant script">'+esc(v.script||"")+'</textarea>'
    +'<div class="row" style="gap:18px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;"><label class="row" style="gap:6px;cursor:pointer;"><input type="checkbox" class="v_start"'+((v.start_enabled!==false)?" checked":"")+'> Use for Start of call</label><label class="row" style="gap:6px;cursor:pointer;"><input type="checkbox" class="v_other"'+((v.other_enabled!==false)?" checked":"")+'> Use elsewhere</label></div>';
  wrap.querySelector(".vrm").onclick=function(){ wrap.remove(); };
  $("varList").appendChild(wrap);
}
function collectVariants(){
  var out=[];
  document.querySelectorAll("#varList .variant").forEach(function(w){
    var kw=w.querySelector(".v_kw").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var sc=w.querySelector(".v_sc").value.trim();
    if(sc) out.push({ keywords:kw, script:sc, start_enabled:!!w.querySelector(".v_start").checked, other_enabled:!!w.querySelector(".v_other").checked });
  });
  return out;
}
function saveAd(id){
  var kws=$("f_keywords").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
  var body={
    sponsor:$("f_sponsor").value.trim(), industry:$("f_industry").value.trim(),
    script:$("f_script").value.trim(), keywords:kws,
    bid_cpm:parseFloat($("f_bid").value)||0, daily_cap:parseInt($("f_cap").value)||100,
    weight:parseFloat($("f_weight").value)||1, placement:$("f_placement").value,
    variants:collectVariants()
  };
  if(!body.sponsor){ toast("Sponsor is required"); return; }
  var btn=$("saveBtn"); btn.disabled=true; btn.textContent="Saving…";
  var req = id ? api("/admin/ads/"+encodeURIComponent(id),"PUT",body) : api("/admin/ads","POST",body);
  req.then(function(){ closeModal(); toast(id?"Ad updated":"Ad created"); renderAds(); })
     .catch(function(e){ btn.disabled=false; btn.textContent="Save"; toast("Failed: "+e.message); });
}
function toggleAd(id){
  api("/admin/ads/"+encodeURIComponent(id)+"/toggle","POST").then(function(){ toast("Updated"); renderAds(); }).catch(function(e){ toast("Failed: "+e.message); });
}
function deleteAd(id,name){
  confirmModal("Delete ad?","Permanently remove "+(name||"this ad")+"? This can&rsquo;t be undone.","Delete",function(){
    api("/admin/ads/"+encodeURIComponent(id),"DELETE").then(function(){ toast("Deleted"); renderAds(); }).catch(function(e){ toast("Failed: "+e.message); });
  });
}

/* ---- frequency ---- */
var FREQ_FIELDS=[
  ["min_interval_seconds","Min seconds between ads","Minimum gap between two ads in a single call."],
  ["max_ads","Max ads per window","Cap on ads within the rolling window below."],
  ["window_seconds","Rolling window (seconds)","The window the cap above applies to."],
  ["force_min_ads_after_seconds","Force an ad after (seconds)","If a long call is under target, relax matching to place one."],
  ["min_ads_target","Min ads target","Lower bound used by the rule above."]
];
function renderFrequency(){
  var v=$("view"); v.innerHTML='<div class="loading">loading…</div>';
  api("/admin/settings","GET").then(function(d){
    var f=(d&&d.frequency)||{};
    var html='<div class="section-card"><h3>Ad Frequency (per call)</h3>'
      + FREQ_FIELDS.map(function(fld){
        return '<div class="field"><label>'+esc(fld[1])+'</label><input type="number" id="q_'+fld[0]+'" value="'+(f[fld[0]]!=null?f[fld[0]]:0)+'"><div class="hint">'+fld[2]+'</div></div>';
      }).join("")
      +'<button class="btn primary block" id="saveFreq">Save frequency</button></div>'
      +'<div class="section-card"><h3>How placement interacts</h3><div class="muted">Ads with a <b>Start of call</b> or <b>After web search</b> placement play at that moment regardless of these caps. These limits govern the automatic keyword-matched ads.</div></div>';
    v.innerHTML=html;
    $("saveFreq").onclick=function(){
      var body={}; FREQ_FIELDS.forEach(function(fld){ body[fld[0]]=parseInt($("q_"+fld[0]).value)||0; });
      var b=$("saveFreq"); b.disabled=true; b.textContent="Saving…";
      api("/admin/settings","PUT",body).then(function(){ b.disabled=false; b.textContent="Save frequency"; toast("Frequency saved"); })
        .catch(function(e){ b.disabled=false; b.textContent="Save frequency"; toast("Failed: "+e.message); });
    };
  }).catch(showErr);
}

/* ---- intro / outro ---- */
function renderCue(){
  var v=$("view"); v.innerHTML='<div class="loading">loading…</div>';
  Promise.all([api("/admin/ad-cue","GET"), api("/admin/ad-outro","GET")]).then(function(res){
    var cue=res[0]||{}, outro=res[1]||{};
    function block(title, desc, set, secs, fileId, upId, rmId){
      return '<div class="section-card"><h3>'+title+'</h3>'
        +'<div class="muted" style="margin-bottom:14px;">'+desc+'</div>'
        +'<div class="row" style="margin-bottom:16px;">'+(set
          ? '<span class="badge b-green"><span class="dot"></span>SOUND SET</span><span class="dim">'+(secs||0)+'s</span>'
          : '<span class="badge b-gray"><span class="dot"></span>NO SOUND</span>')+'</div>'
        +'<div class="field"><input type="file" id="'+fileId+'" accept="audio/mpeg,audio/*"></div>'
        +'<div class="row"><button class="btn primary" id="'+upId+'">Upload</button>'+(set?'<button class="btn red" id="'+rmId+'">Remove</button>':'')+'</div>'
        +'</div>';
    }
    var html='<div class="muted" style="margin-bottom:14px;">These sounds are shared by <b>every</b> ad. The intro plays right before each ad and the outro right after. Converted once on upload &mdash; no per-call cost.</div>'
      +block("Intro sound","Plays right before every ad, so callers know a sponsor message is coming.", cue.set, cue.seconds, "cueFile","cueUp","cueRm")
      +block("Outro sound","Plays right after every ad.", outro.set, outro.seconds, "outroFile","outroUpG","outroRmG");
    v.innerHTML=html;
    $("cueUp").onclick=function(){ uploadSound("cueFile","cueUp","/admin/ad-cue"); };
    if($("cueRm")) $("cueRm").onclick=function(){ api("/admin/ad-cue","DELETE").then(function(){ toast("Intro removed"); renderCue(); }).catch(function(e){ toast("Failed: "+e.message); }); };
    $("outroUpG").onclick=function(){ uploadSound("outroFile","outroUpG","/admin/ad-outro"); };
    if($("outroRmG")) $("outroRmG").onclick=function(){ api("/admin/ad-outro","DELETE").then(function(){ toast("Outro removed"); renderCue(); }).catch(function(e){ toast("Failed: "+e.message); }); };
  }).catch(showErr);
}
function uploadSound(fileId, btnId, path){
  var el=$(fileId); var f=el&&el.files&&el.files[0];
  if(!f){ toast("Choose an MP3 first"); return; }
  var b=$(btnId); b.disabled=true; b.textContent="Uploading…";
  var rd=new FileReader();
  rd.onload=function(){
    var b64=String(rd.result).split(",")[1];
    api(path,"POST",{ mp3_b64:b64 }).then(function(){ toast("Saved"); renderCue(); })
      .catch(function(e){ b.disabled=false; b.textContent="Upload"; toast("Failed: "+e.message); });
  };
  rd.readAsDataURL(f);
}

/* ---- billing ---- */
var MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthLabel(ym){
  if(!ym || ym==="unknown" || String(ym).indexOf("-")<0) return ym||"Unknown";
  var parts=String(ym).split("-"); var mi=parseInt(parts[1],10)-1;
  return (MONTH_NAMES[mi]||parts[1])+" "+parts[0];
}
function billAmount(plays, cpm){ return (Number(plays)||0)*(Number(cpm)||0)/1000; }
function recalcCard(card){
  var cpm=parseFloat(card.querySelector(".co-cpm").value)||0;
  var tot=0;
  card.querySelectorAll("[data-plays]").forEach(function(row){
    var plays=parseInt(row.getAttribute("data-plays"))||0;
    var amt=billAmount(plays,cpm); tot+=amt;
    var ae=row.querySelector(".amt"); if(ae) ae.textContent=money(amt);
  });
  card.querySelector(".co-total").textContent=money(tot);
  recalcGrand();
}
function recalcGrand(){
  var g=0;
  document.querySelectorAll(".co-total").forEach(function(el){ g+=parseFloat(el.textContent.replace(/[^0-9.\-]/g,""))||0; });
  var ge=$("grandTotal"); if(ge) ge.textContent=money(g);
}
function renderBilling(){
  var v=$("view"); v.innerHTML='<div class="loading">loading…</div>';
  api("/admin/billing","GET").then(function(d){
    var cos=(d&&d.companies)||[];
    if(!cos.length){ v.innerHTML='<div class="section-card"><div class="muted">No companies yet. Add an ad with a sponsor name to start tracking plays and billing.</div></div>'; return; }
    var html='<div class="grid stats" style="margin-bottom:18px;">'
      +statCard("Companies", String(cos.length))
      +'<div class="stat"><div class="label">Billable across all months</div><div class="value" id="grandTotal">$0.00</div></div>'
      +'</div>';
    html+='<div class="muted" style="margin-bottom:16px;">Each month shows that company&rsquo;s plays &times; its CPM (price per 1,000 plays). Edit a rate to update the totals instantly; <b>Save rate</b> stores it on that company&rsquo;s ads for future plays.</div>';
    html+=cos.map(function(co){
      var months=co.months||{};
      var keys=Object.keys(months).sort().reverse();
      var rows=keys.map(function(ym){
        return '<div class="between" data-plays="'+(months[ym]||0)+'" style="padding:8px 0;border-top:1px solid var(--border);font-family:var(--mono);font-size:13px;">'
          +'<span style="flex:1;">'+esc(monthLabel(ym))+'</span>'
          +'<span class="dim" style="margin:0 14px;">'+(months[ym]||0)+' plays</span>'
          +'<span class="amt" style="color:var(--text);font-weight:700;min-width:78px;text-align:right;">$0.00</span>'
          +'</div>';
      }).join("");
      if(!keys.length){ rows='<div class="muted" style="padding:8px 0;border-top:1px solid var(--border);">No plays recorded yet.</div>'; }
      return '<div class="section-card" data-co="'+esc(co.sponsor)+'">'
        +'<div class="between" style="margin-bottom:14px;">'
        +'<div><div style="font-size:16px;font-weight:700;">'+esc(co.sponsor)+'</div><div class="dim" style="margin-top:2px;">'+(co.total_plays||0)+' total plays</div></div>'
        +'<div style="text-align:right;"><div class="dim">company total</div><div class="co-total" style="font-size:22px;font-weight:700;font-family:var(--mono);">$0.00</div></div></div>'
        +'<div class="row" style="gap:10px;align-items:flex-end;margin-bottom:4px;">'
        +'<div class="field" style="margin:0;flex:1;max-width:210px;"><label>CPM (per 1,000 plays)</label><input type="number" step="0.01" min="0" class="co-cpm" value="'+(co.cpm!=null?co.cpm:0)+'"></div>'
        +'<button class="btn cyan sm co-save" type="button">Save rate</button></div>'
        +rows
        +'</div>';
    }).join("");
    v.innerHTML=html;
    document.querySelectorAll(".section-card[data-co]").forEach(function(card){
      var sp=card.getAttribute("data-co");
      var inp=card.querySelector(".co-cpm");
      inp.addEventListener("input",function(){ recalcCard(card); });
      card.querySelector(".co-save").onclick=function(){ saveCompanyCpm(card); };
      recalcCard(card);
    });
  }).catch(showErr);
}
function saveCompanyCpm(card){
  var sp=card.getAttribute("data-co");
  var cpm=parseFloat(card.querySelector(".co-cpm").value);
  if(isNaN(cpm)||cpm<0){ toast("Enter a valid CPM"); return; }
  var btn=card.querySelector(".co-save"); btn.disabled=true; btn.textContent="Saving…";
  api("/admin/company-cpm","POST",{ sponsor:sp, cpm:cpm }).then(function(r){
    btn.disabled=false; btn.textContent="Save rate";
    var n=(r&&r.updated)||0;
    toast(n?("Rate saved ("+n+" ad"+(n===1?"":"s")+")"):"Rate saved");
    STATS=null;
  }).catch(function(e){ btn.disabled=false; btn.textContent="Save rate"; toast("Failed: "+e.message); });
}

/* ---- modals ---- */
function openModal(html){ $("modal").innerHTML=html; $("modalBg").classList.add("show"); }
function closeModal(){ $("modalBg").classList.remove("show"); }
function confirmModal(title,text,confirmLabel,onYes){
  openModal('<h3>'+title+'</h3><p class="muted" style="margin-bottom:6px;">'+text+'</p><div class="modal-actions"><button class="btn" id="cmNo">Cancel</button><button class="btn red" id="cmYes">'+confirmLabel+'</button></div>');
  $("cmNo").onclick=closeModal;
  $("cmYes").onclick=function(){ closeModal(); onYes(); };
}
function showErr(e){ $("view").innerHTML='<div class="section-card"><div class="err">Error: '+esc(e.message||String(e))+'</div></div>'; }

/* ---- events ---- */
document.addEventListener("click",function(e){
  var nav=e.target.closest(".nav[data-sec]"); if(nav){ show(nav.dataset.sec); return; }
  if(e.target.closest("#newAdBtn")){ adModal(null); return; }
  var ed=e.target.closest("[data-edit]"); if(ed){ adModal(adById(ed.dataset.edit)); return; }
  var tg=e.target.closest("[data-toggle]"); if(tg){ toggleAd(tg.dataset.toggle); return; }
  var dl=e.target.closest("[data-del]"); if(dl){ deleteAd(dl.dataset.del, dl.dataset.name); return; }
});
$("hamburger").onclick=function(){ $("sidebar").classList.contains("open")?closeNav():openNav(); };
$("overlay").onclick=closeNav;
$("themeBtn").onclick=toggleTheme;
$("refreshBtn").onclick=refresh;
$("tokenBtn").onclick=unlock;
$("tokenInput").addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });
$("signout").onclick=function(e){ e.preventDefault(); logout(); };
$("modalBg").addEventListener("click",function(e){ if(e.target===$("modalBg")) closeModal(); });

window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredInstall=e; $("installBtn").style.display="grid"; });
$("installBtn").onclick=function(){ if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; $("installBtn").style.display="none"; } };

/* ---- boot ---- */
applyTheme();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(function(){}); }
(function(){
  var saved=""; try{ saved=localStorage.getItem("ac_token")||""; }catch(e){}
  if(saved){ TOKEN=saved; api("/admin/stats","GET").then(function(){ show("overview"); }).catch(function(){ logout(); }); }
  else { logout(); }
})();
</script>
</body>
</html>
